# Phase 1: MoE World Model - SMAC 5m_vs_6m Medium
env_type: smac
env_name: 5m_vs_6m
data_split: Medium
n_agents: 5
obs_dim: 60
act_dim: 12
discrete_action: true
num_actions: 12

# MoE model
n_dyn_experts: 8
n_rew_experts: 4
hidden_dim: 256
n_slots: 4

# Training
batch_size: 256
learning_rate: 0.0003
n_train_steps: 40000
val_ratio: 0.1
save_freq: 5000
log_freq: 500

use_wandb: true
wandb_project: "CoFlow-WM"
wandb_run_name: "phase1-wm-5m_vs_6m-medium"
