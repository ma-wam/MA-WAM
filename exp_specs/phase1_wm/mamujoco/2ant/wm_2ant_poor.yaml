# Phase 1: MoE World Model 训练配置 - 2Ant Poor
env_type: mamujoco
env_name: 2ant
data_split: Poor
n_agents: 2
obs_dim: 56  # Ant 2-agent per-agent obs dim
act_dim: 4   # Ant 2-agent per-agent act dim

# MoE 模型配置
n_dyn_experts: 8
n_rew_experts: 4
hidden_dim: 256
n_slots: 4

# 训练配置
batch_size: 256
learning_rate: 0.0003
n_train_steps: 40000
val_ratio: 0.1
save_freq: 5000
log_freq: 500

# wandb
use_wandb: true
wandb_project: "CoFlow-WM"
wandb_run_name: "phase1-wm-2ant-poor"
